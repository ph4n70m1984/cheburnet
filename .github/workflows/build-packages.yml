name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            goarch: arm64
            goarm: ""
            gomips: ""
            opkg_arch: aarch64_cortex-a53
            apk_arch: aarch64
            use_upx: true

          - arch: arm_cortex-a7
            goarch: arm
            goarm: "7"
            gomips: ""
            opkg_arch: arm_cortex-a7_neon-vfpv4
            apk_arch: armhf
            use_upx: true

          # MediaTek MT7621, MT7628, ramips/mipsel (Cudy, Keenetic, Xiaomi, TP-Link Archer C6U и др.)
          - arch: mipsel_24kc
            goarch: mipsle
            goarm: ""
            gomips: "softfloat"
            opkg_arch: mipsel_24kc
            apk_arch: mipsle
            use_upx: false

          # Qualcomm Atheros / Big-Endian MIPS (AR7xxx/AR9xxx)
          - arch: mips_24kc
            goarch: mips
            goarm: ""
            gomips: "softfloat"
            opkg_arch: mips_24kc
            apk_arch: mips
            use_upx: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx

      - name: Extract Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.1-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compile cheburnetd
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          go build -ldflags="-s -w -X main.CheburVersion=${{ steps.vars.outputs.version }}" \
                   -trimpath \
                   -o bin/cheburnetd ./cmd/cheburnetd

      - name: Compress binary with UPX
        if: ${{ matrix.use_upx }}
        run: |
          upx --best --lzma bin/cheburnetd

      - name: Copy raw binary for Manager UpgradeSelf
        run: |
          mkdir -p dist
          cp bin/cheburnetd dist/cheburnetd_linux_${{ matrix.goarch }}

      - name: Pack .ipk Package
        run: |
          PKG_DIR="ipk_pkg"
          mkdir -p "$PKG_DIR/control" "$PKG_DIR/data/usr/bin" "$PKG_DIR/data/etc/init.d" \
                   "$PKG_DIR/data/etc/config" "$PKG_DIR/data/www/luci-static/resources/view/cheburnet" \
                   "$PKG_DIR/data/usr/share/luci/menu.d" "$PKG_DIR/data/usr/share/rpcd/acl.d"

          cp bin/cheburnetd "$PKG_DIR/data/usr/bin/cheburnetd"
          chmod 755 "$PKG_DIR/data/usr/bin/cheburnetd"

          if [ -f openwrt/files/etc/init.d/cheburnet ]; then
              cp openwrt/files/etc/init.d/cheburnet "$PKG_DIR/data/etc/init.d/cheburnet"
          fi
          chmod 755 "$PKG_DIR/data/etc/init.d/cheburnet"

          if [ -f openwrt/files/etc/config/cheburnet ]; then
              cp openwrt/files/etc/config/cheburnet "$PKG_DIR/data/etc/config/cheburnet"
              chmod 644 "$PKG_DIR/data/etc/config/cheburnet"
          fi

          # Копируем LuCI Web UI
          if [ -d openwrt/files/www/luci-static/resources/view/cheburnet ]; then
              cp -r openwrt/files/www/luci-static/resources/view/cheburnet/* "$PKG_DIR/data/www/luci-static/resources/view/cheburnet/"
          elif [ -d luci-app-cheburnet/htdocs/luci-static/resources/view/cheburnet ]; then
              cp -r luci-app-cheburnet/htdocs/luci-static/resources/view/cheburnet/* "$PKG_DIR/data/www/luci-static/resources/view/cheburnet/"
          elif [ -d www/luci-static/resources/view/cheburnet ]; then
              cp -r www/luci-static/resources/view/cheburnet/* "$PKG_DIR/data/www/luci-static/resources/view/cheburnet/"
          fi

          if [ -f openwrt/files/usr/share/luci/menu.d/luci-app-cheburnet.json ]; then
              cp openwrt/files/usr/share/luci/menu.d/luci-app-cheburnet.json "$PKG_DIR/data/usr/share/luci/menu.d/"
          elif [ -f luci-app-cheburnet/root/usr/share/luci/menu.d/luci-app-cheburnet.json ]; then
              cp luci-app-cheburnet/root/usr/share/luci/menu.d/luci-app-cheburnet.json "$PKG_DIR/data/usr/share/luci/menu.d/"
          fi

          # ACL манифест для rpcd
          if [ -f openwrt/files/usr/share/rpcd/acl.d/luci-app-cheburnet.json ]; then
              cp openwrt/files/usr/share/rpcd/acl.d/luci-app-cheburnet.json "$PKG_DIR/data/usr/share/rpcd/acl.d/"
          elif [ -f luci-app-cheburnet/root/usr/share/rpcd/acl.d/luci-app-cheburnet.json ]; then
              cp luci-app-cheburnet/root/usr/share/rpcd/acl.d/luci-app-cheburnet.json "$PKG_DIR/data/usr/share/rpcd/acl.d/"
          else
              cat <<'EOF' > "$PKG_DIR/data/usr/share/rpcd/acl.d/luci-app-cheburnet.json"
          {
              "luci-app-cheburnet": {
                  "description": "Grant UCI access for Chebur.NET LuCI app",
                  "read": {
                      "uci": [ "cheburnet" ]
                  },
                  "write": {
                      "uci": [ "cheburnet" ]
                  }
              }
          }
          EOF
          fi

          cat <<EOF > "$PKG_DIR/control/control"
          Package: luci-app-cheburnet
          Version: ${{ steps.vars.outputs.version }}
          Depends: sing-box, nftables, ip-full, ca-bundle
          Section: luci
          Architecture: ${{ matrix.opkg_arch }}
          Maintainer: Developer <dev@example.com>
          Description: Transparent proxy and routing daemon on top of sing-box/xray
          EOF

          echo "/etc/config/cheburnet" > "$PKG_DIR/control/conffiles"
          echo "2.0" > "$PKG_DIR/debian-binary"

          tar --numeric-owner --owner=0 --group=0 -czf "$PKG_DIR/data.tar.gz" -C "$PKG_DIR/data" .
          tar --numeric-owner --owner=0 --group=0 -czf "$PKG_DIR/control.tar.gz" -C "$PKG_DIR/control" .

          IPK_NAME="luci-app-cheburnet_${{ steps.vars.outputs.version }}_${{ matrix.opkg_arch }}.ipk"
          tar --numeric-owner --owner=0 --group=0 -czf "$IPK_NAME" \
              -C "$PKG_DIR" debian-binary control.tar.gz data.tar.gz

          mv "$IPK_NAME" dist/

      - name: Pack .apk Package
        run: |
          APK_DATA_DIR="apk_data"
          mkdir -p "$APK_DATA_DIR/usr/bin" "$APK_DATA_DIR/etc/init.d" "$APK_DATA_DIR/etc/config" \
                   "$APK_DATA_DIR/www/luci-static/resources/view/cheburnet" \
                   "$APK_DATA_DIR/usr/share/luci/menu.d" "$APK_DATA_DIR/usr/share/rpcd/acl.d"

          cp bin/cheburnetd "$APK_DATA_DIR/usr/bin/cheburnetd"
          chmod 755 "$APK_DATA_DIR/usr/bin/cheburnetd"

          if [ -f openwrt/files/etc/init.d/cheburnet ]; then
              cp openwrt/files/etc/init.d/cheburnet "$APK_DATA_DIR/etc/init.d/cheburnet"
          fi
          chmod 755 "$APK_DATA_DIR/etc/init.d/cheburnet"

          if [ -f openwrt/files/etc/config/cheburnet ]; then
              cp openwrt/files/etc/config/cheburnet "$APK_DATA_DIR/etc/config/cheburnet"
              chmod 644 "$APK_DATA_DIR/etc/config/cheburnet"
          fi

          if [ -d openwrt/files/www/luci-static/resources/view/cheburnet ]; then
              cp -r openwrt/files/www/luci-static/resources/view/cheburnet/* "$APK_DATA_DIR/www/luci-static/resources/view/cheburnet/"
          elif [ -d luci-app-cheburnet/htdocs/luci-static/resources/view/cheburnet ]; then
              cp -r luci-app-cheburnet/htdocs/luci-static/resources/view/cheburnet/* "$APK_DATA_DIR/www/luci-static/resources/view/cheburnet/"
          elif [ -d www/luci-static/resources/view/cheburnet ]; then
              cp -r www/luci-static/resources/view/cheburnet/* "$APK_DATA_DIR/www/luci-static/resources/view/cheburnet/"
          fi

          if [ -f openwrt/files/usr/share/luci/menu.d/luci-app-cheburnet.json ]; then
              cp openwrt/files/usr/share/luci/menu.d/luci-app-cheburnet.json "$APK_DATA_DIR/usr/share/luci/menu.d/"
          elif [ -f luci-app-cheburnet/root/usr/share/luci/menu.d/luci-app-cheburnet.json ]; then
              cp luci-app-cheburnet/root/usr/share/luci/menu.d/luci-app-cheburnet.json "$APK_DATA_DIR/usr/share/luci/menu.d/"
          fi

          if [ -f openwrt/files/usr/share/rpcd/acl.d/luci-app-cheburnet.json ]; then
              cp openwrt/files/usr/share/rpcd/acl.d/luci-app-cheburnet.json "$APK_DATA_DIR/usr/share/rpcd/acl.d/"
          elif [ -f luci-app-cheburnet/root/usr/share/rpcd/acl.d/luci-app-cheburnet.json ]; then
              cp luci-app-cheburnet/root/usr/share/rpcd/acl.d/luci-app-cheburnet.json "$APK_DATA_DIR/usr/share/rpcd/acl.d/"
          else
              cat <<'EOF' > "$APK_DATA_DIR/usr/share/rpcd/acl.d/luci-app-cheburnet.json"
          {
              "luci-app-cheburnet": {
                  "description": "Grant UCI access for Chebur.NET LuCI app",
                  "read": {
                      "uci": [ "cheburnet" ]
                  },
                  "write": {
                      "uci": [ "cheburnet" ]
                  }
              }
          }
          EOF
          fi

          # Нормализация формата версии для apk (число-rчисло)
          CLEAN_VER="${{ steps.vars.outputs.version }}"
          if [[ "$CLEAN_VER" != *-r* ]]; then
              CLEAN_VER="${CLEAN_VER}-r1"
          fi

          mkdir -p apk_meta dist
          CALC_SIZE=$(du -sb "$APK_DATA_DIR" | awk '{print $1}')

          # Формирование строго валидного .PKGINFO без недопустимых директив
          cat <<EOF > apk_meta/.PKGINFO
          pkgname = luci-app-cheburnet
          pkgver = ${CLEAN_VER}
          pkgdesc = Transparent proxy and routing daemon on top of sing-box/xray
          url = https://github.com/${{ github.repository }}
          builddate = $(date +%s)
          packager = GitHub Actions
          size = ${CALC_SIZE}
          arch = ${{ matrix.apk_arch }}
          depend = sing-box
          depend = nftables
          depend = ip-full
          depend = ca-bundle
          EOF

          # Удаление пробелов в начале строк манифеста (требование парсера apk-tools)
          sed -i 's/^[[:blank:]]*//' apk_meta/.PKGINFO

          APK_FILE="luci-app-cheburnet-${CLEAN_VER}.${{ matrix.apk_arch }}.apk"

          # Сборка пакета через официальный инструмент Alpine apk mkpkg
          docker run --rm -v "$(pwd):/work" -w /work alpine:edge sh -c "
            apk add --no-cache apk-tools >/dev/null 2>&1
            apk mkpkg --info apk_meta/.PKGINFO \
                      --output dist/$APK_FILE \
                      apk_data
          "

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > sha256sums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Regenerate Unified Checksums
        run: |
          cd release-assets
          rm -f sha256sums.txt
          sha256sum * > sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true